<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Safe Space Chat</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Blendet Bereiche aus, die gerade nicht gebraucht werden */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- BEREICH 1: ANMELDUNG (Wird zuerst angezeigt) -->
    <div id="loginArea">
        <h1>Willkommen im Safe Space Chat</h1>
        <p>Bitte gib deinen Namen ein, um dem Chat beizutreten:</p>
        <input id="nameInput" placeholder="Dein Name...">
        <button onclick="saveName()">Beitreten</button>
    </div>

    <!-- BEREICH 2: CHAT (Wird erst nach Namenseingabe sichtbar) -->
    <div id="chatArea" class="hidden">
        <h1>TEST CHAT MAUSI</h1>
        <p id="user"></p>
        <div id="messages"></div>
        <input id="message" placeholder="Schreibe etwas...">
        <button onclick="sendMessage()">Senden</button>
    </div>

    <script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_tcVqcq5vuHjplh3Qf7m5FA_P-Z3xy03";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentName = localStorage.getItem("chatName");

    // Funktion zum Einloggen
    function saveName() {
        let eingabe = document.getElementById("nameInput").value;
        if (eingabe.trim() === "") {
            alert("Bitte gib einen gültigen Namen ein!");
            return;
        }
        localStorage.setItem("chatName", eingabe.trim());
        currentName = eingabe.trim();
        startChatSession();
    }

    // Schaltet die Ansicht von Login auf Chat um
    function startChatSession() {
        document.getElementById("loginArea").classList.add("hidden");
        document.getElementById("chatArea").classList.remove("hidden");
        document.getElementById("user").innerHTML = "Du bist angemeldet als: " + currentName;
        loadMessages();
    }

    // Nachrichten senden
    async function sendMessage() {
        let text = document.getElementById("message").value;
        if (text.trim() === "") return;

        await supabase
            .from("messages")
            .insert([{ username: currentName, message: text }]);

        document.getElementById("message").value = "";
    }

    // Nachrichten laden
    async function loadMessages() {
        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .order("id", { ascending: true });

        if (error) {
            console.error("Fehler beim Laden:", error);
            return;
        }

        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";
        
        data.forEach(msg => {
            messagesDiv.innerHTML += `<p><strong>${msg.username}:</strong> ${msg.message}</p>`;
        });
    }

    // Live-Updates empfangen
    supabase
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML += `<p><strong>${payload.new.username}:</strong> ${payload.new.message}</p>`;
        })
        .subscribe();

    // Beim Laden der Seite prüfen, ob bereits ein Name existiert
    if (currentName) {
        startChatSession();
    }
    </script>

</body>
</html>
