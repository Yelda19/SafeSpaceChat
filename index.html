<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Safe Space Chat</title>
    <!-- Offizielle Supabase-Bibliothek -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .hidden { display: none !important; }
        #messages { border: 1px solid #ccc; background: white; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
        .error-log { color: red; background: #ffdada; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid red; }
    </style>
</head>
<body>

    <!-- Fehler-Anzeige für den Browser-Bildschirm -->
    <div id="statusMonitor" class="error-log hidden"></div>

    <!-- BEREICH 1: ANMELDUNG -->
    <div id="loginArea">
        <h1>Willkommen im Safe Space Chat</h1>
        <p>Bitte gib deinen Namen ein, um dem Chat beizutreten:</p>
        <input id="nameInput" placeholder="Dein Name...">
        <button id="joinBtn" onclick="saveName()">Beitreten</button>
    </div>

    <!-- BEREICH 2: CHAT -->
    <div id="chatArea" class="hidden">
        <h1>TEST CHAT MAUSI</h1>
        <p id="user"></p>
        <div id="messages"></div>
        <input id="message" placeholder="Schreibe etwas...">
        <button onclick="sendMessage()">Senden</button>
        <button onclick="logout()" style="background:#ccc; margin-left:10px;">Name wechseln</button>
    </div>

    <script>
    // System-Logs direkt auf dem Bildschirm anzeigen
    function showError(text) {
        const monitor = document.getElementById("statusMonitor");
        monitor.classList.remove("hidden");
        monitor.innerHTML = "<strong>System-Fehler:</strong> " + text;
    }

    const SUPABASE_URL = "https://oqcepyftwjaxhvpdxymc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tcVqcq5vuHjplh3Qf7m5FA_P-Z3xy03";
    
    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } catch(e) {
        showError("Supabase konnte nicht geladen werden. Prüfe deine Internetverbindung.");
    }

    let currentName = localStorage.getItem("chatName");

    function saveName() {
        let eingabe = document.getElementById("nameInput").value;
        if (eingabe.trim() === "") {
            alert("Bitte gib einen Namen ein!");
            return;
        }
        localStorage.setItem("chatName", eingabe.trim());
        currentName = eingabe.trim();
        startChatSession();
    }

    function logout() {
        localStorage.removeItem("chatName");
        location.reload();
    }

    function startChatSession() {
        document.getElementById("loginArea").classList.add("hidden");
        document.getElementById("chatArea").classList.remove("hidden");
        document.getElementById("user").innerHTML = "Du bist angemeldet als: <b>" + currentName + "</b>";
        loadMessages();
        initRealtime();
    }

    async function sendMessage() {
        let text = document.getElementById("message").value;
        if (text.trim() === "") return;

        const { error } = await supabase
            .from("messages")
            .insert([{ username: currentName, message: text }]);

        if (error) {
            showError("Senden fehlgeschlagen! Grund: " + error.message + " (Prüfe die RLS-Richtlinien im Supabase-Dashboard!)");
        } else {
            document.getElementById("message").value = "";
        }
    }

    async function loadMessages() {
        const { data, error } = await supabase
            .from("messages")
            .select("*")
            .order("id", { ascending: true });

        if (error) {
            showError("Laden fehlgeschlagen! Grund: " + error.message);
            return;
        }

        const messagesDiv = document.getElementById("messages");
        messagesDiv.innerHTML = "";
        
        data.forEach(msg => {
            messagesDiv.innerHTML += `<p><strong>${msg.username}:</strong> ${msg.message}</p>`;
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function initRealtime() {
        supabase
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                const messagesDiv = document.getElementById("messages");
                messagesDiv.innerHTML += `<p><strong>${payload.new.username}:</strong> ${payload.new.message}</p>`;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            })
            .subscribe((status) => {
                if (status === "CHANNEL_ERROR") {
                    console.log("Realtime konnte nicht gestartet werden. Das ist normal, falls Realtime im Dashboard deaktiviert ist.");
                }
            });
    }

    // Beim Start prüfen
    if (currentName) {
        startChatSession();
    }
    </script>

</body>
</html>
