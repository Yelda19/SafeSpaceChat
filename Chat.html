<script>
const SUPABASE_URL = https://oqcepyftwjaxhvpdxymc.supabase.co
const SUPABASE_KEY = sb_publishable_tcVqcq5vuHjplh3Qf7m5FA_P-Z3xy03

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
let name = localStorage.getItem("chatName");

if(!name){
    window.location.href = "beitreten.html";
}

document.getElementById("user").innerHTML =
"Du bist angemeldet als: " + name;


function sendMessage(){

    let text = document.getElementById("message").value;

    if(text.trim() === ""){
        return;
    }

    let messageBox = document.getElementById("messages");

    let newMessage = document.createElement("p");

    newMessage.innerHTML =
    "<b>" + name + ":</b> " + text;

    messageBox.appendChild(newMessage);

    document.getElementById("message").value = "";

}

</script>
