<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<title>Safe Space Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<h1>Safe Space Gruppenchat</h1>

<p id="user"></p>

<div id="messages">
</div>

<input id="message" placeholder="Schreibe etwas...">

<button onclick="sendMessage()">
Senden
</button>


<script>

const SUPABASE_URL = "https://oqcepyftwjaxhvpdxymc.supabase.co";
const SUPABASE_KEY = "sb_publishable_tcVqcq5vuHjplh3Qf7m5FA_P-Z3xy03";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let name = localStorage.getItem("chatName");


if(!name){
    window.location.href = "beitreten.html";
}


document.getElementById("user").innerHTML =
"Du bist angemeldet als: " + name;


async function sendMessage(){

    let text = document.getElementById("message").value;

    if(text.trim() === ""){
        return;
    }

    await supabase
    .from("messages")
    .insert([
        {
            username: name,
            message: text
        }
    ]);

    document.getElementById("message").value = "";

}

    
loadMessages();
</script>

</body>
</html>
